# The demo profile remains available; fixed registration OTP is opt-in only.
registration.demo-otp=${REGISTRATION_DEMO_OTP:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=15000
management.health.mail.enabled=false
