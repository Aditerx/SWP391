spring.application.name=sports-center-management

# Load local secrets when .env exists; the file is ignored by Git.
spring.config.import=optional:file:.env[.properties]

# Server port — Render injects the PORT environment variable.
server.port=${PORT:8080}

# Database — values injected via environment variables (Render dashboard / local .env).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Limit automatic no-show finalization to recent sessions unless overridden.
scms.attendance.lookback-days=${SCMS_ATTENDANCE_LOOKBACK_DAYS:3}

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# Actuator — only expose health endpoint (used by Render health check).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

# SMTP credentials are supplied via environment variables or the ignored local .env file.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
# A verified sender can differ from the SMTP login (e.g. Brevo).
scms.mail.from-address=${MAIL_FROM_EMAIL:${spring.mail.username:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
registration.demo-otp=${REGISTRATION_DEMO_OTP:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
google.client-id=${GOOGLE_CLIENT_ID:}
google.auto-register=${GOOGLE_AUTO_REGISTER:true}

# Payment configuration (sandbox defaults are non-secret; credentials come from env/.env).
payment.expire-minutes=${SCMS_PAYMENT_EXPIRE_MINUTES:${PAYMENT_EXPIRE_MINUTES:5}}
scms.booking-block.enabled=${SCMS_BOOKING_BLOCK_ENABLED:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
payment.frontend-result-url=${FRONTEND_PAYMENT_RESULT_URL:http://localhost:5173/payment-result}
vnpay.query-enabled=${VNPAY_QUERY_ENABLED:false}
vnpay.query-settlement-enabled=${VNPAY_QUERY_SETTLEMENT_ENABLED:false}
vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.query-ip-address=${VNPAY_QUERY_IP_ADDR:}
vnpay.query-connect-timeout-seconds=${VNPAY_QUERY_CONNECT_TIMEOUT_SECONDS:3}
vnpay.query-request-timeout-seconds=${VNPAY_QUERY_REQUEST_TIMEOUT_SECONDS:5}
vnpay.network-probe-enabled=${VNPAY_NETWORK_PROBE_ENABLED:false}

# Chat AI remains off by default. Use provider=mock for local FE integration without an API key.
scms.ai.chat.enabled=${SCMS_AI_CHAT_ENABLED:false}
scms.ai.chat.provider=${SCMS_AI_CHAT_PROVIDER:mock}
scms.ai.chat.new-conversation-handler=${SCMS_AI_CHAT_NEW_CONVERSATION_HANDLER:STAFF}
scms.ai.chat.model=${SCMS_AI_CHAT_MODEL:}
scms.ai.chat.api-key=${ANTHROPIC_API_KEY:}
scms.ai.chat.base-url=${SCMS_AI_CHAT_BASE_URL:https://api.anthropic.com}
scms.ai.chat.api-version=${SCMS_AI_CHAT_API_VERSION:2026-10-21}
scms.ai.chat.timeout-seconds=${SCMS_AI_CHAT_TIMEOUT_SECONDS:12}
scms.ai.chat.max-tokens=${SCMS_AI_CHAT_MAX_TOKENS:400}
scms.ai.chat.max-input-characters=${SCMS_AI_CHAT_MAX_INPUT_CHARACTERS:8000}
scms.ai.chat.max-knowledge-base-characters=${SCMS_AI_CHAT_MAX_KNOWLEDGE_BASE_CHARACTERS:12000}
scms.ai.chat.daily-limit-per-member=${SCMS_AI_CHAT_DAILY_LIMIT_PER_MEMBER:30}
scms.ai.chat.faq-match-threshold=${SCMS_AI_CHAT_FAQ_MATCH_THRESHOLD:2}
scms.ai.chat.faq-max-answer-characters=${SCMS_AI_CHAT_FAQ_MAX_ANSWER_CHARACTERS:1200}
scms.ai.chat.faq-fallback-escalation-threshold=${SCMS_AI_CHAT_FAQ_FALLBACK_ESCALATION_THRESHOLD:2}
scms.ai.chat.faq-sensitive-keywords=${SCMS_AI_CHAT_FAQ_SENSITIVE_KEYWORDS:hoan tien,refund,doi lich,huy goi,huy buoi,thanh toan,hoa don,khieu nai,tai khoan,su co suc khoe}
scms.ai.chat.temperature=${SCMS_AI_CHAT_TEMPERATURE:0.2}
scms.ai.chat.deepseek-base-url=${SCMS_AI_CHAT_DEEPSEEK_BASE_URL:https://api.deepseek.com}
scms.ai.chat.deepseek-model=${SCMS_AI_CHAT_DEEPSEEK_MODEL:deepseek-flash}
scms.ai.chat.deepseek-timeout-seconds=${SCMS_AI_CHAT_DEEPSEEK_TIMEOUT_SECONDS:12}
scms.ai.chat.deepseek-max-tokens=${SCMS_AI_CHAT_DEEPSEEK_MAX_TOKENS:400}
scms.ai.chat.deepseek-api-key=${DEEPSEEK_API_KEY:}
scms.ai.chat.mock-reply=${SCMS_AI_CHAT_MOCK_REPLY:Xin ch\u00e0o! T\u00f4i l\u00e0 tr\u1ee3 l\u00fd h\u1ed7 tr\u1ee3 SCMS. T\u00f4i c\u00f3 th\u1ec3 gi\u00fap b\u1ea1n t\u00ecm hi\u1ec3u d\u1ecbch v\u1ee5, l\u1ecbch t\u1eadp, g\u00f3i t\u1eadp v\u00e0 ch\u00ednh s\u00e1ch c\u1ee7a trung t\u00e2m. V\u1edbi th\u00f4ng tin t\u00e0i kho\u1ea3n ho\u1eb7c y\u00eau c\u1ea7u c\u1ea7n x\u1eed l\u00fd, vui l\u00f2ng ch\u1ecdn g\u1eb7p nh\u00e2n vi\u00ean.}
