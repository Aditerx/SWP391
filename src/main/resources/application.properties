spring.application.name=sports-center-management

# Load local secrets when .env exists; the file is ignored by Git.
spring.config.import=optional:file:.env[.properties]

# Server port — Render injects the PORT environment variable.
server.port=${PORT:8080}

# Database — values injected via environment variables (Render dashboard / local .env).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator — only expose health endpoint (used by Render health check).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
