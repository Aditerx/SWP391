services:
  - type: web
    name: scms-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render will call this path to verify the service is healthy after each deploy.
    healthCheckPath: /actuator/health
    # Auto-deploy triggers after CI checks pass (configured in the GitHub repo settings).
    autoDeploy: true
    envVars:
      # Set these values in the Render dashboard — never commit real credentials.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: REGISTRATION_DEMO_OTP
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTO_REGISTER
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: "true"
