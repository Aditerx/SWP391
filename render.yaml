services:
  - type: web
    name: scms-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render will call this path to verify the service is healthy after each deploy.
    healthCheckPath: /actuator/health
    # Auto-deploy triggers after CI checks pass (configured in the GitHub repo settings).
    autoDeploy: true
    envVars:
      # Set these values in the Render dashboard — never commit real credentials.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: REGISTRATION_DEMO_OTP
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTO_REGISTER
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SCMS_AI_CHAT_ENABLED
        value: "false"
      - key: SCMS_AI_CHAT_PROVIDER
        value: mock
      - key: SCMS_AI_CHAT_DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: SCMS_AI_CHAT_DEEPSEEK_MODEL
        value: deepseek-flash
      - key: SCMS_AI_CHAT_DEEPSEEK_TIMEOUT_SECONDS
        value: "12"
      - key: SCMS_AI_CHAT_DEEPSEEK_MAX_TOKENS
        value: "400"
      - key: SCMS_AI_CHAT_MAX_KNOWLEDGE_BASE_CHARACTERS
        value: "12000"
      - key: SCMS_AI_CHAT_TEMPERATURE
        value: "0.2"
      - key: SCMS_AI_CHAT_DAILY_LIMIT_PER_MEMBER
        value: "30"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SCMS_AI_CHAT_NEW_CONVERSATION_HANDLER
        value: STAFF
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SCMS_AI_CHAT_MODEL
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: "true"
